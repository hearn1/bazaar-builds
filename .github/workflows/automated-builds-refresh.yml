# Runs the automated builds refresh pipeline and, in live_cron, updates rolling
# proposal PRs in hearn1/bazaar_coach.
#
# Cadence: weekly (Mondays). bazaardb is patch-scoped and readiness Gate 2 is a
# calendar span, so daily runs add cost/PR churn without speeding promotion. Use
# the workflow_dispatch trigger below for an on-demand run when a new Bazaar
# patch drops and you want its window captured before the next Monday.
#
# Required secrets:
# - TRACKER_PR_TOKEN: fine-grained PAT scoped to hearn1/bazaar_coach with
#   Contents: Read & Write and Pull requests: Read & Write.
#   Note: the secret is still named TRACKER_PR_TOKEN; after the repo rename the
#   PAT must have been updated (or re-confirmed) to grant access to bazaar_coach.

name: Automated builds refresh

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    # Weekly, Monday 06:00 UTC (one hour before the live-sources smoke).
    - cron: "0 6 * * 1"
  # Manual trigger for on-demand "a patch just dropped, run now" refreshes.
  workflow_dispatch:
    inputs:
      hero:
        description: "Hero to refresh"
        required: true
        type: choice
        options:
          - Karnok
          - Mak
          - Dooley
          - Vanessa
          - Pygmalien
          - Jules
          - Stelle
      phase_override:
        description: "Optional one-run phase override: implementation, local_dry_run, shadow_cron, or live_cron"
        required: false
        type: string
      classifier_mode:
        description: "Classifier strategy: deterministic or no_llm_shadow. Scheduled runs default to deterministic."
        required: false
        default: ""
        type: string

concurrency:
  group: pipeline-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hero: [Karnok, Mak, Dooley, Vanessa, Pygmalien, Jules, Stelle]

    steps:
      - name: Check selected hero
        id: selected
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.hero }}" == "${{ matrix.hero }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out bazaar-builds
        if: steps.selected.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Check out bazaar_coach
        if: steps.selected.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: hearn1/bazaar_coach
          path: bazaar_coach
          token: ${{ secrets.TRACKER_PR_TOKEN }}

      - name: Set up Python
        if: steps.selected.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.selected.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        if: steps.selected.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Prepare run state
        if: steps.selected.outputs.run == 'true'
        id: state
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("pipeline_state.json")
          if source.exists():
              state = json.loads(source.read_text(encoding="utf-8"))
          else:
              state = {
                  "schema_version": 1,
                  "phase": "implementation",
                  "dry_run": True,
                  "patch_label": None,
                  "expected_bazaardb_patch_label": None,
                  "freeze_removals_until": None,
                  "hero_freezes": {},
              }

          override = "${{ inputs.phase_override }}"
          if override:
              allowed = {"implementation", "local_dry_run", "shadow_cron", "live_cron"}
              if override not in allowed:
                  raise SystemExit(f"phase_override must be one of {sorted(allowed)}")
              state["phase"] = override
              state["dry_run"] = override != "live_cron"

          target = Path(os.environ["RUNNER_TEMP"]) / "pipeline_state.json"
          target.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"state_file={target}\n")
              handle.write(f"phase={state['phase']}\n")
              handle.write(f"dry_run={str(state['dry_run']).lower()}\n")
          PY

      - name: Enforce live_cron readiness gate
        if: steps.selected.outputs.run == 'true' && steps.state.outputs.phase == 'live_cron'
        run: |
          python -m automated_builds_pipeline.readiness \
            --stats-dir "$GITHUB_WORKSPACE/stats" \
            --state-file "${{ steps.state.outputs.state_file }}" \
            --waiver-dir "$GITHUB_WORKSPACE/waivers" \
            --enforce

      - name: Configure coach git identity
        if: steps.selected.outputs.run == 'true' && steps.state.outputs.phase == 'live_cron'
        working-directory: bazaar_coach
        run: |
          git config user.name "bazaar-builds-bot"
          git config user.email "bazaar-builds-bot@users.noreply.github.com"

      - name: Run pipeline
        if: steps.selected.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRACKER_PR_TOKEN }}
        run: |
          classifier_mode="${{ inputs.classifier_mode }}"
          if [[ -z "$classifier_mode" ]]; then
            classifier_mode="deterministic"
          fi

          xvfb-run -a python -m automated_builds_pipeline.pipeline run \
            --hero "${{ matrix.hero }}" \
            --state-file "${{ steps.state.outputs.state_file }}" \
            --tracker-repo "$GITHUB_WORKSPACE/bazaar_coach" \
            --stats-dir "$GITHUB_WORKSPACE/stats" \
            --output-dir "$GITHUB_WORKSPACE/artifacts" \
            --classifier-mode "$classifier_mode" \
            --bazaardb-retries 2

      - name: Persist stats via rolling PR
        if: steps.selected.outputs.run == 'true' && github.ref_name == 'main' && (steps.state.outputs.phase == 'shadow_cron' || steps.state.outputs.phase == 'live_cron')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "bazaar-builds-bot"
          git config user.email "bazaar-builds-bot@users.noreply.github.com"

          hero_slug=$(echo "${{ matrix.hero }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_//; s/_$//')
          stats_file="stats/${hero_slug}_stats.json"
          run_date=$(date -u +%Y%m%d)
          # One run-scoped branch per stats update. Repository rules disallow
          # force-pushes, so these PRs merge/delete themselves instead of
          # reusing a stable rolling branch.
          branch="automated/stats-sync-${hero_slug}-${{ github.run_id }}-${{ github.run_attempt }}"

          if [[ ! -f "$stats_file" ]]; then
            echo "No stats file was written for ${{ matrix.hero }}"
            exit 0
          fi

          git fetch origin main

          # Stash freshly-generated stats, reset working tree to main, then
          # re-apply so the branch contains exactly main + this one-file delta.
          cp "$stats_file" "$RUNNER_TEMP/${hero_slug}_stats.json"
          git checkout -B "$branch" origin/main
          mkdir -p stats
          cp "$RUNNER_TEMP/${hero_slug}_stats.json" "$stats_file"
          git add "$stats_file"

          if git diff --cached --quiet; then
            echo "No stats changes for ${{ matrix.hero }} vs main"
            exit 0
          fi

          git commit -m "automated: persist ${{ matrix.hero }} stats ${run_date}"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "automated: persist ${{ matrix.hero }} stats" \
            --body "Stats sidecar PR for ${{ matrix.hero }}. Created by the builds refresh workflow and merged automatically because stats sidecars are machine state.")
          pr_number=$(gh pr view "$pr_url" --json number --jq '.number')

          changed_files=$(gh pr view "$pr_number" --json files --jq '.files[].path')
          if [[ "$changed_files" != "$stats_file" ]]; then
            echo "Refusing to auto-merge stats PR #${pr_number}: expected only ${stats_file}, got:"
            echo "$changed_files"
            exit 1
          fi

          echo "Waiting for stats PR #${pr_number} checks before merge."
          gh pr checks "$pr_number" --watch --interval 10

          echo "Merging stats PR #${pr_number}."
          gh pr merge "$pr_number" --squash --delete-branch

      - name: Upload shadow artifacts
        if: steps.selected.outputs.run == 'true' && (steps.state.outputs.phase != 'live_cron' || steps.state.outputs.dry_run == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: automated-builds-${{ matrix.hero }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
