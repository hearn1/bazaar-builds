# Required secrets:
# - TRACKER_PR_TOKEN: legacy-named PAT scoped to hearn1/bazaar_coach with
#   Contents: Read (for checkout). The secret retains its old name; the PAT
#   must grant access to bazaar_coach.

name: Live sources smoke

permissions:
  contents: read
  issues: write

on:
  schedule:
    # Weekly, Friday 07:00 UTC (after the automated builds refresh).
    - cron: "0 7 * * 5"
  workflow_dispatch:

concurrency:
  group: live-sources-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out bazaar-builds
        uses: actions/checkout@v4

      - name: Check out bazaar_coach
        uses: actions/checkout@v4
        with:
          repository: hearn1/bazaar_coach
          path: bazaar_coach
          token: ${{ secrets.TRACKER_PR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run source health smoke
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p artifacts
          xvfb-run -a python -m automated_builds_pipeline.smoke \
            --tracker-repo "$GITHUB_WORKSPACE/bazaar_coach" \
            --output "$GITHUB_WORKSPACE/artifacts/source-health.json"

      - name: Upload source health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-health-${{ github.run_id }}
          path: artifacts/source-health.json
          if-no-files-found: error

      - name: Open or update smoke-failure issue
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[smoke] required source unhealthy"
          health_file="$GITHUB_WORKSPACE/artifacts/source-health.json"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          summary="(source-health.json not produced)"
          if [[ -f "$health_file" ]]; then
            summary=$(cat "$health_file")
          fi

          body=$(printf 'The weekly live-sources smoke reported a required source as unhealthy.\n\nRun: %s\n\n```json\n%s\n```\n' "$run_url" "$summary")

          existing=$(gh issue list --state open --search "in:title $title" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Fail on required source health failure
        if: steps.smoke.outcome == 'failure'
        run: exit 1
