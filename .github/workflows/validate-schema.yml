name: Validate catalog schema

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out bazaar_coach
        uses: actions/checkout@v4
        with:
          repository: hearn1/bazaar_coach
          path: bazaar_coach

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate coach catalogs against schema
        run: |
          python - <<'EOF'
          import json
          import sys
          from pathlib import Path

          try:
              import jsonschema
          except ImportError:
              print("jsonschema not installed", file=sys.stderr)
              sys.exit(1)

          root = Path("bazaar_coach/builds")
          schema_path = root / "builds_schema.json"
          catalog_paths = sorted(root.glob("*_builds.json"))

          if not schema_path.is_file():
              print(f"missing coach schema at {schema_path}", file=sys.stderr)
              sys.exit(1)

          if not catalog_paths:
              print(
                  "no coach catalogs found — expected *_builds.json in bazaar_coach/builds/",
                  file=sys.stderr,
              )
              sys.exit(1)

          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          errors = []
          for path in catalog_paths:
              print(f"Validating {path} ...", end=" ")
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  jsonschema.validate(instance=data, schema=schema)
                  print("OK")
              except jsonschema.ValidationError as exc:
                  print(f"FAIL: {exc.message}")
                  errors.append((path, exc.message))
              except json.JSONDecodeError as exc:
                  print(f"FAIL: invalid JSON: {exc}")
                  errors.append((path, str(exc)))

          if errors:
              print(f"\n{len(errors)} validation error(s):", file=sys.stderr)
              for path, msg in errors:
                  print(f"  {path}: {msg}", file=sys.stderr)
              sys.exit(1)

          print(f"\nAll {len(catalog_paths)} catalog(s) valid.")
          EOF
